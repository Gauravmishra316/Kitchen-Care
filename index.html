<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KitchenCare — Indian Restaurant Kitchen & Service Management POS</title>
  
  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥘</text></svg>">
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="header-container">
      <div class="logo-badge">
        <span class="app-icon">🥘</span>
        <span style="font-weight:800; font-size:18px;">KitchenCare</span>
        <div class="db-status-pill">
          <span id="dbStatusDot" class="db-status-dot"></span>
          <span id="dbStatusText">SQLite Live</span>
        </div>
      </div>

      <div class="nav-actions">
        <!-- Language Switcher -->
        <button id="langToggleBtn" class="btn-secondary badge-icon-btn" onclick="toggleLanguage()">
          🌐 <span id="langLabel">हिन्दी</span>
        </button>

        <!-- Help Button with 3-step tips -->
        <button id="helpBtn" class="btn-secondary badge-icon-btn" onclick="openHelpModal()">
          ❓ <span data-i18n="help">Help</span>
        </button>

        <!-- Bell Notifications Icon -->
        <button id="alertsBtn" class="btn-secondary badge-icon-btn" onclick="openAlertsModal()">
          🔔 <span data-i18n="alerts">Alerts</span>
          <span id="alertsBadge" class="notification-count" style="display:none;">0</span>
        </button>

        <!-- Logout Button (Always Visible) -->
        <button id="logoutBtn" class="btn-outline" style="min-height:42px; padding:6px 14px; font-size:14px;" onclick="confirmLogout()">
          🚪 <span data-i18n="logout">Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Role Info Bar -->
  <div id="roleBar" class="role-bar" style="display:none;">
    <div class="role-bar-container">
      <div class="user-pill">
        <span id="roleIcon">👨‍🍳</span>
        <span id="currentUserName">Amit Patel</span>
        <span style="color:var(--text-light); font-weight:normal;">•</span>
        <span id="currentRoleTitle" style="color:var(--primary); font-weight:700;">Kitchen Manager</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn-secondary" onclick="openSwitchStaffModal()" style="min-height:34px; padding:2px 12px; font-size:12px; font-weight:700; border-radius:18px;">
            👥 Switch Staff
          </button>
          <button class="btn-outline" onclick="lockTerminal()" style="min-height:34px; padding:2px 10px; font-size:12px; border-radius:18px;" title="Lock POS">
            🔒 Lock
          </button>
        </div>
        <div id="roleClock" style="font-weight:600; color:var(--text-muted); font-size:13px;">12:00 PM</div>
      </div>
    </div>
  </div>

  <!-- Role Tabs (Max 5 items per role) -->
  <div id="navTabsBar" class="main-nav-tabs" style="display:none;">
    <div id="tabsContainer" class="nav-tabs-container">
      <!-- Injected Dynamically Based on Role -->
    </div>
  </div>

  <!-- Global Alert Bar (If urgent issues exist) -->
  <div id="globalAlertBanner" class="alert-banner" style="display:none;">
    <span id="globalAlertText">⚠️ 2 ingredients near expiry & 1 fridge temperature overdue.</span>
    <button class="btn-secondary" style="min-height:36px; padding:4px 12px; font-size:13px;" onclick="openAlertsModal()" data-i18n="view_action">Review</button>
  </div>

  <!-- Main View Container -->
  <main id="appContent" class="app-content">
    <!-- Views will be mounted here -->
  </main>

  <!-- Global Toast Notification -->
  <div id="toast">
    <span id="toastIcon">✅</span>
    <span id="toastMsg">Action completed successfully</span>
  </div>

  <!-- Generic Modal Root -->
  <div id="modalContainer" style="display:none;"></div>

  <!-- Modular Application Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chef.js"></script>
  <script src="js/waiter.js"></script>
  <script src="js/manager.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
